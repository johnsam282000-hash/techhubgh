<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TECH HUB GH - Phones, Laptops, Tablets</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', Arial}
header{background:linear-gradient(135deg,#007BFF,#004a99);color:#fff;padding:40px 20px;text-align:center}
header h1{font-size:2.2em;margin-bottom:8px}
.filters{display:flex;gap:10px;padding:20px;justify-content:center;background:#fff;flex-wrap:wrap;position:sticky;top:0;z-index:10;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.filter-btn{padding:10px 20px;border:2px solid #007BFF;background:#fff;color:#007BFF;border-radius:25px;font-weight:600;cursor:pointer;transition:.3s}
.filter-btn.active{background:#007BFF;color:#fff}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:25px;padding:30px 15px;max-width:1300px;margin:auto}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 5px 20px rgba(0,0,0,.1);transition:.3s}
.card:hover{transform:translateY(-5px)}
.card img{width:100%;height:250px;object-fit:cover;background:#f5f5f5}
.card-content{padding:20px}
.tags{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tag{background:#e3f2fd;color:#007BFF;padding:5px 12px;border-radius:15px;font-size:.8em;font-weight:600}
.tag.used{background:#FFF3CD;color:#856404} 
.tag.new{background:#D4EDDA;color:#155724}
.card h3{font-size:1.2em;margin-bottom:8px;color:#333}
.card p{color:#666;font-size:.9em;margin-bottom:15px;line-height:1.5}
.price{font-size:1.8em;color:#00C851;font-weight:700;margin:15px 0}
.btn{width:100%;padding:14px;background:#25D366;color:#fff;border:none;border-radius:10px;font-weight:700;font-size:1em;cursor:pointer;transition:.3s}
.btn:hover{background:#1da851}
footer{text-align:center;padding:30px;background:#f8f9fa;margin-top:30px}
</style>
</head>
<body>

<header>
  <h1>TECH HUB GH</h1>
  <p>UK Used & Brand New Phones, Laptops, Tablets 🇬🇭</p>
</header>

<div class="filters">
  <button class="filter-btn active" onclick="show('All',this)">All</button>
  <button class="filter-btn" onclick="show('Phones',this)">Phones</button>
  <button class="filter-btn" onclick="show('Laptops',this)">Laptops</button>
  <button class="filter-btn" onclick="show('Tablets',this)">Tablets</button>
</div>

<div class="products" id="p"></div>

<footer>
  <p><b>📱 WhatsApp: +233547488369</b></p>
  <p>Accra, Ghana | 1 Month Warranty | DM to Order</p>
</footer>

<script>
const data=[
{n:"iPad A16 128GB",c:"Tablets",p:"GHS 4,800",i:"ipad-a16.jpg",d:"Brand New, Wi-Fi Only, Sealed, Fast Chip",cond:"new"},
{n:"iPhone 16 128GB",c:"Phones",p:"GHS 7,500",i:"iphone16.jpg",d:"Brand New, Pink/Blue, Installment Allowed",cond:"new"},
{n:"iPhone 17e 256GB",c:"Phones",p:"GHS 4,500",i:"iphone17e.jpg",d:"Brand New, Sealed, eSIM Only",cond:"new"},
{n:"iPhone 16 Plus 128GB",c:"Phones",p:"GHS 8,200",i:"iphone16plus.jpg",d:"Brand New, Multiple Colors Available",cond:"new"},
{n:"iPhone 13 128GB",c:"Phones",p:"GHS 3,650",i:"iphone13.jpg",d:"UK Used, Too Much Clean, Available in Quantity",cond:"used"},
{n:"HP EliteBook 1030 G8",c:"Laptops",p:"GHS 6,800",i:"hp-1030.jpg",d:"UK Used, i7 11th Gen, 16GB RAM, 1TB SSD, X360 Touchscreen",cond:"used"},
{n:"Lenovo ThinkPad P14s Gen2",c:"Laptops",p:"GHS 4,600",i:"thinkpad-p14s.jpg",d:"UK Used, i7 11th Gen, 16GB RAM, 256GB SSD, NVIDIA T500 Gaming",cond:"used"},
{n:"Lenovo ThinkPad T490",c:"Laptops",p:"GHS 3,000",i:"thinkpad-t490.jpg",d:"UK Used, i5 8th Gen, 8GB RAM, 256GB SSD, Fingerprint",cond:"used"}
];

function show(cat,btn){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  p.innerHTML='';
  data.filter(x=>cat=='All'||x.c==cat).forEach(x=>{
    let badge = x.cond=='new' ? '<span class="tag new">BRAND NEW</span>' : '<span class="tag used">UK USED</span>';
    p.innerHTML += `
    <div class="card">
      <img src="${x.i}" alt="${x.n}">
      <div class="card-content">
        <div class="tags">${badge}<span class="tag">${x.c}</span></div>
        <h3>${x.n}</h3>
        <p>${x.d}</p>
        <div class="price">${x.p}</div>
        <button class="btn" onclick="window.open('https://wa.me/233547488369?text=Hi TECH HUB GH, I am interested in: ${x.n} - ${x.p}')">📱 Order on WhatsApp</button>
      </div>
    </div>`
  })
}

// THIS LINE MAKES IT LOAD AUTOMATICALLY
window.onload = function() { show('All', document.querySelector('.filter-btn')) }
</script>

</body>
</html>
