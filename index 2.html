<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TECH HUB GH - UK Used Phones, Laptops & Accessories</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5}
header{background:#1a1a1a;color:white;padding:20px;text-align:center;position:sticky;top:0;z-index:10}
header h1{color:#00d4ff;font-size:28px}
header p{color:#ccc;margin-top:5px}
.container{max-width:1200px;margin:20px auto;padding:0 15px}
.filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.filters button{padding:10px 20px;border:none;background:white;border-radius:8px;cursor:pointer;font-weight:bold}
.filters button.active{background:#00d4ff;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.card img{width:100%;height:200px;object-fit:cover}
.card-content{padding:15px}
.card h3{font-size:16px;margin-bottom:8px}
.price{color:#00d4ff;font-size:20px;font-weight:bold;margin:8px 0}
.category{font-size:12px;color:#666;background:#eee;padding:4px 8px;border-radius:4px;display:inline-block}
.desc{font-size:13px;color:#555;margin:8px 0}
.whatsapp-btn{display:block;width:100%;background:#25D366;color:white;text-align:center;padding:12px;border:none;border-radius:8px;font-weight:bold;text-decoration:none;margin-top:10px}
.whatsapp-btn:hover{background:#22c55e}
.loading{text-align:center;padding:40px;font-size:18px}
</style>
</head>
<body>
<header>
  <h1>TECH HUB GH</h1>
  <p>Quality UK Used Phones, Laptops & Accessories</p>
</header>

<div class="container">
  <div class="filters">
    <button class="filter-btn active" data-category="All">All</button>
    <button class="filter-btn" data-category="Phones">Phones</button>
    <button class="filter-btn" data-category="Laptops">Laptops</button>
    <button class="filter-btn" data-category="Accessories">Accessories</button>
  </div>

  <div id="products" class="grid">
    <div class="loading">Loading products...</div>
  </div>
</div>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1ImwZdtEOd1X1tB4kypSHUjtNNwMxGnTU0TTYn2gr5zE/export?format=csv';
const WHATSAPP = '+233547488369';

let allProducts = [];

async function loadProducts() {
  try {
    const res = await fetch(SHEET_URL);
    const csv = await res.text();
    const rows = csv.split('\n').slice(1);
    
    allProducts = rows.map(row => {
      const [image, name, price, category, desc, whatsapp] = row.split(',');
      return {image, name, price, category, desc, whatsapp: whatsapp || WHATSAPP};
    }).filter(p => p.name);
    
    displayProducts(allProducts);
  } catch(e) {
    document.getElementById('products').innerHTML = '<p>Error loading products</p>';
  }
}

function displayProducts(products) {
  const grid = document.getElementById('products');
  grid.innerHTML = products.map(p => `
    <div class="card">
      <img src="${p.image}" alt="${p.name}">
      <div class="card-content">
        <span class="category">${p.category}</span>
        <h3>${p.name}</h3>
        <p class="desc">${p.desc}</p>
        <div class="price">GHS ${p.price}</div>
        <a class="whatsapp-btn" href="https://wa.me/${p.whatsapp.replace(/\+/g,'')}?text=Hi TECH HUB GH, I'm interested in ${encodeURIComponent(p.name)} for GHS ${p.price}" target="_blank">
          Order on WhatsApp
        </a>
      </div>
    </div>
  `).join('');
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const cat = btn.dataset.category;
    const filtered = cat === 'All' ? allProducts : allProducts.filter(p => p.category === cat);
    displayProducts(filtered);
  }
});

loadProducts();
</script>
</body>
</html>
